name: Video GO

on: 
    push:
        branches: 
            - main
    pull_request:
        branches: 
            - main

permissions:
    contents: read

jobs: 
    quality:
        name: Testes e compilação
        runs-on: ubuntu-latest
    
        steps:
            - name: Baixar o código
              uses: actions/checkout@v6

            - name: Instalar dependências gráficas (Fyne / CGO)
              run: |
                sudo apt-get update
                sudo apt-get install -y libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

            - name: Configurar Go
              uses: actions/setup-go@v6
              with:
                go-version-file: go.mod
                cache: true

            - name: Veirificar formatação
              run: |
                test -z "$(gofmt -l .)"
            
            # - name: Verificar dependências
            #   run: go mod tidy -diff
            
            - name: Análise estática
              run: go vet ./... 
            
            - name: Executar testes
              run: go test -race ./... 
            
            - name: Compilar
              run: go build -o /tmp/gestorvideo-build ./...